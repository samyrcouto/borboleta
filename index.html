<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dream of Butterfly — Neon</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#07030f}
canvas{display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;pointer-events:none;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),
 radial-gradient(circle at 50% 50%,transparent 55%,rgba(3,0,10,.75));mix-blend-mode:multiply}
#cap{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));text-align:center;
 font:12px Helvetica,Arial,sans-serif;letter-spacing:.38em;color:#d3b4ff;opacity:.6;pointer-events:none;text-shadow:0 0 10px #8a4dff}
#txt{position:fixed;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));margin:0 auto;width:min(760px,88vw);text-align:center;color:#dcccff;text-shadow:0 0 12px rgba(138,77,255,.7),0 0 2px rgba(0,0,0,.9);transition:opacity 1.1s;pointer-events:none;font-family:Georgia,'Noto Serif CJK SC','Songti SC',serif}
#txt p{margin:0}
#zh{font-size:clamp(15px,2.4vw,20px);letter-spacing:.12em;line-height:1.8;margin-bottom:10px}
#pt{font-size:clamp(12px,1.8vw,15px);line-height:1.6;opacity:.85;font-style:italic}
.c{display:inline-block;width:0;height:1.05em;border-left:2px solid #dcccff;vertical-align:text-bottom;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
</style>
</head>
<body>
<div id="fx"></div>
<div id="txt"><p id="zh"></p><p id="pt"></p></div>
<div id="cap">DREAM OF BUTTERFLY</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const SH={value:800}, TM={value:0};

// ---------- shaders ----------
const COL=`vec3 col(float t){vec3 a=vec3(.28,.12,.75),b=vec3(.5,.28,.9),c=vec3(.78,.62,1.);
 return mix(mix(a,b,smoothstep(0.,.55,t)),c,smoothstep(.55,1.,t));}`;
const VL=`attribute float aT;uniform float uBend,uTime;varying float vT;
void main(){vT=aT;vec3 p=position;
 p.y+=uBend*p.x*p.x*.35+.03*sin(uTime*3.+p.x*5.+p.z*4.)*aT*step(.01,p.x);
 gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`;
const VP=`attribute float aT;uniform float uBend,uTime,uSize,uH;varying float vT;
void main(){vT=aT;vec3 p=position;
 p.y+=uBend*p.x*p.x*.35+.03*sin(uTime*3.+p.x*5.+p.z*4.)*aT*step(.01,p.x);
 vec4 mv=modelViewMatrix*vec4(p,1.);gl_Position=projectionMatrix*mv;
 gl_PointSize=uSize*length(modelViewMatrix[0].xyz)*uH*1.07/-mv.z*(.6+.8*aT);}`;
const FL=COL+`varying float vT;uniform float uAlpha;
void main(){gl_FragColor=vec4(col(vT)*(.55+.45*vT),uAlpha);}`;
const FF=COL+`varying float vT;uniform float uAlpha;
void main(){gl_FragColor=vec4(col(vT),uAlpha*vT*vT);}`;
const FP=COL+`varying float vT;uniform float uAlpha,uFade;
void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,0.,d);float c=smoothstep(.22,0.,d);
 gl_FragColor=vec4(mix(col(vT),vec3(1.),c*.8),uAlpha*a*mix(1.,vT,uFade));}`;

function mat(kind,U,extra={}){
  const frag={l:FL,f:FF,p:FP}[kind], vert=kind==='p'?VP:VL;
  return new THREE.ShaderMaterial({
    uniforms:Object.assign({uTime:TM,uH:SH,uBend:U.uBend,uAlpha:{value:kind==='f'?.07:kind==='p'?.8:.7},uSize:{value:.07},uFade:{value:0}},extra),
    vertexShader:vert,fragmentShader:frag,transparent:true,depthWrite:false,
    blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
}
function geo(pts,t){
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  g.setAttribute('aT',new THREE.Float32BufferAttribute(Array.isArray(t)?t:pts.map(()=>t),1));return g;}

// ---------- asa ----------
const segs=[
 [[0,230],[60,115],[205,5],[345,25]],[[345,25],[440,50],[455,130],[405,195]],
 [[405,195],[380,232],[300,246],[255,250]],[[255,250],[360,265],[428,318],[408,385]],
 [[408,385],[398,425],[378,470],[345,515]],[[345,515],[305,478],[255,472],[205,470]],
 [[205,470],[100,425],[30,350],[0,300]]];
const outline=[];
segs.forEach(s=>{for(let i=0;i<6;i++){const t=i/6,u=1-t,B=k=>u*u*u*s[0][k]+3*u*u*t*s[1][k]+3*u*t*t*s[2][k]+t*t*t*s[3][k];
  outline.push(V(B(0)/256*1.15,0,(250-B(1))/256*1.15));}});
const O=V(0,0,0),n=outline.length,pos=(p,s)=>O.clone().lerp(p,s);
const LP=[],LT=[],DP=[],DT=[],FP_=[],FT=[];
const rings=[.16,.3,.45,.6,.76,.9,1];
outline.forEach(p=>{for(let k=0;k<7;k++){const a=k/7,b=(k+1)/7;LP.push(pos(p,a),pos(p,b));LT.push(a,b);}});
rings.forEach(r=>{for(let i=0;i<n-1;i++){LP.push(pos(outline[i],r),pos(outline[i+1],r));LT.push(r,r);}
  outline.forEach(p=>{DP.push(pos(p,r));DT.push(r);});});
for(let i=0;i<n-1;i++){const m=outline[i].clone().add(outline[i+1]).multiplyScalar(.5);
  LP.push(pos(m,.4),m);LT.push(.4,1);}
for(let i=0;i<n-1;i++){FP_.push(O,outline[i],outline[i+1]);FT.push(0,1,1);}
const gL=geo(LP,LT),gD=geo(DP,DT),gF=geo(FP_,FT);

// ---------- corpo ----------
function tube(zs,rs,seg=10){
  const P=[],T=[];
  const ring=(z,r)=>Array.from({length:seg},(_,i)=>{const a=i/seg*Math.PI*2;return V(Math.cos(a)*r,Math.sin(a)*r*.85,z);});
  const R=zs.map((z,k)=>ring(z,rs[k]));
  R.forEach((rg,k)=>{rg.forEach((p,i)=>{P.push(p,rg[(i+1)%seg]);T.push(.55,.55);
    if(R[k+1]){P.push(p,R[k+1][i]);T.push(.55,.8);}});});
  return geo(P,T);
}
const bodyZ=[.5,.46,.4,.34,.28,.2,.1,0,-.1,-.22,-.36,-.52,-.7,-.88,-1.02];
const bodyR=[.005,.045,.065,.05,.06,.09,.105,.09,.075,.082,.075,.065,.05,.03,.008];
const gBody=tube(bodyZ,bodyR);
const ant=[],antT=[];
[-1,1].forEach(s=>{const q=[V(s*.03,.02,.46),V(s*.1,.07,.66),V(s*.2,.12,.84),V(s*.3,.1,.98),V(s*.36,.05,1.04)];
  for(let i=0;i<4;i++){ant.push(q[i],q[i+1]);antT.push(.6+i*.1,.7+i*.1);}});
const legs=[],legT=[];
[-1,1].forEach(s=>[.2,.08,-.04].forEach((z,i)=>{
  const a=V(s*.05,-.07,z),b=V(s*.2,-.2,z+.08-i*.06),c=V(s*.3,-.4,z-.1-i*.05);
  legs.push(a,b,b,c);legT.push(.5,.7,.7,.9);}));
const gAnt=geo(ant,antT),gLeg=geo(legs,legT);
const gBD=geo([V(0,0,.34),V(0,0,.1),V(0,0,-.2),V(0,0,-.6),V(-.3,.1,.98).multiplyScalar(1).setX(-.36).setY(.05).setZ(1.04),V(.36,.05,1.04),V(-.04,.05,.44),V(.04,.05,.44)],
  [.9,.7,.7,.7,1,1,1,1]);

function makeButterfly(){
  const U={uBend:{value:0}},U0={uBend:{value:0}};
  const mL=mat('l',U),mD=mat('p',U,{uSize:{value:.04}}),mF=mat('f',U);
  const bL=mat('l',U0,{uAlpha:{value:.8}}),bD=mat('p',U0,{uSize:{value:.07}});
  const root=new THREE.Group(),inner=new THREE.Group();
  inner.add(new THREE.LineSegments(gBody,bL),new THREE.LineSegments(gAnt,bL),new THREE.LineSegments(gLeg,bL),new THREE.Points(gBD,bD));
  const mkWing=()=>{const g=new THREE.Group();
    g.add(new THREE.LineSegments(gL,mL),new THREE.Points(gD,mD),new THREE.Mesh(gF,mF));return g;};
  const pR=new THREE.Group(),pL=new THREE.Group(),wR=mkWing(),wL=mkWing();wL.scale.x=-1;
  pR.position.set(.05,.04,.18);pL.position.set(-.05,.04,.18);
  pR.add(wR);pL.add(wL);inner.add(pR,pL);root.add(inner);
  root.userData={pR,pL,inner,U};return root;
}

// ---------- cena ----------
const scene=new THREE.Scene();
const bg=document.createElement('canvas');bg.width=2;bg.height=256;
{const g=bg.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);
 gr.addColorStop(0,'#0a0418');gr.addColorStop(.55,'#1d0d3d');gr.addColorStop(1,'#07030f');g.fillStyle=gr;g.fillRect(0,0,2,256);}
scene.background=new THREE.CanvasTexture(bg);
const camera=new THREE.PerspectiveCamera(50,1,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
const pr=Math.min(devicePixelRatio,2);renderer.setPixelRatio(pr);
document.body.appendChild(renderer.domElement);

let composer=null;
if(THREE.EffectComposer&&THREE.UnrealBloomPass){
  composer=new THREE.EffectComposer(renderer);composer.setPixelRatio(pr);
  composer.addPass(new THREE.RenderPass(scene,camera));
  composer.bloom=new THREE.UnrealBloomPass(new THREE.Vector2(800,600),.5,.4,.25);
  composer.addPass(composer.bloom);
}

// piso
const grid=new THREE.GridHelper(40,40,0x7a44ff,0x35197a);grid.position.y=-3.6;
grid.material=new THREE.LineBasicMaterial({color:0x7a44ff,transparent:true,opacity:.12,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(grid);

// poeira
const dp=[];for(let i=0;i<220;i++)dp.push(V((Math.random()-.5)*26,(Math.random()-.4)*10,(Math.random()-.5)*18));
const dust=new THREE.Points(geo(dp,.35),mat('p',{uBend:{value:0}},{uSize:{value:.04},uAlpha:{value:.3}}));
scene.add(dust);

// borboletas + rastros
const N=5,flies=[],TL=70;
for(let i=0;i<N;i++){
  const b=makeButterfly();b.scale.setScalar(i===0?1.8:Math.max(.45,1-i*.15));
  Object.assign(b.userData,{phase:Math.random()*6,speed:i===0?7:9+Math.random()*3});
  scene.add(b);
  const hist=Array.from({length:TL},()=>V(0,0,0));
  const tg=geo(hist,hist.map((_,k)=>1-k/TL));
  const tr=new THREE.Points(tg,mat('p',{uBend:{value:0}},{uSize:{value:i===0?.05:.035},uAlpha:{value:.5},uFade:{value:1}}));
  tr.frustumCulled=false;scene.add(tr);
  b.userData.hist=hist;b.userData.tg=tg;flies.push(b);
}
const path=t=>V(4.2*Math.sin(t*.35),1.2*Math.sin(t*.6+1)+.3,2.5*Math.cos(t*.28));

function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h);
  if(composer){composer.setSize(w,h);composer.bloom.resolution.set(w,h);}
  camera.aspect=w/h;camera.baseZ=w<h?14:9.5;camera.updateProjectionMatrix();SH.value=h*pr;
}
addEventListener('resize',resize);resize();

let mx=0,my=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
const clock=new THREE.Clock();
function loop(){
  const t=clock.getElapsedTime();TM.value=t;
  flies.forEach((b,i)=>{
    const tt=t-i*.7,p=path(tt),nx=path(tt+.05),off=i===0?0:Math.sin(i*1.7)*.5,d=b.userData;
    b.position.set(p.x,p.y+off,p.z);b.lookAt(nx.x,nx.y+off,nx.z);
    const ph=t*d.speed+d.phase;
    const a=Math.sin(ph)*.85+.2;
    d.pR.rotation.z=a;d.pL.rotation.z=-a;
    d.U.uBend.value=-Math.cos(ph)*.55; // ponta da asa atrasa no batimento
    d.inner.position.y=Math.sin(ph*2)*.05;
    d.hist.unshift(b.position.clone().add(V(0,0,0)));d.hist.pop();
    const arr=d.tg.attributes.position.array;
    d.hist.forEach((q,k)=>{arr[k*3]=q.x;arr[k*3+1]=q.y;arr[k*3+2]=q.z;});
    d.tg.attributes.position.needsUpdate=true;
  });
  dust.rotation.y=t*.02;
  camera.position.x+=((mx*1.5)-camera.position.x)*.05;
  camera.position.y+=((1.2-my*1)-camera.position.y)*.05;
  camera.position.z=camera.baseZ;
  camera.lookAt(0,.2,0);
  if(composer)composer.render();else renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();

// ---------- texto do Zhuangzi digitando em loop ----------
const ZH="昔者莊周夢為胡蝶，栩栩然胡蝶也，自喻適志與！不知周也。俄然覺，則蘧蘧然周也。不知周之夢為胡蝶與？胡蝶之夢為周與？周與胡蝶，則必有分矣。此之謂物化。";
const PT="Certa vez, Zhuang Zhou sonhou que era uma borboleta, voando alegre e satisfeita, sem saber que era Zhou. De repente acordou, e ali estava ele, Zhou em pessoa. Não sabia mais se era Zhou que havia sonhado ser uma borboleta, ou uma borboleta que agora sonhava ser Zhou. Entre Zhou e a borboleta deve haver alguma distinção. A isso se chama a transformação das coisas.";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const txt=document.getElementById('txt'),zhEl=document.getElementById('zh'),ptEl=document.getElementById('pt');
// o resto do texto fica invisível pra reservar espaço e nada pular de lugar
const render=(el,s,i,cur)=>{el.innerHTML=s.slice(0,i)+(cur?'<i class="c"></i>':'')+'<span style="visibility:hidden">'+s.slice(i)+'</span>';};
async function typeIn(el,s,d){
  for(let i=0;i<=s.length;i++){render(el,s,i,true);
    await sleep(/[，。！？,.]/.test(s[i-1]||'')?d*6:d);}
  render(el,s,s.length,false);
}
(async()=>{
  while(true){
    render(zhEl,ZH,0,false);render(ptEl,PT,0,false);txt.style.opacity=1;
    await sleep(900);
    await typeIn(zhEl,ZH,170);
    await sleep(500);
    await typeIn(ptEl,PT,38);
    await sleep(5000);
    txt.style.opacity=0;await sleep(1300);
  }
})();
</script>
</body>
</html>
